[pytest]
# Ajoute la racine du projet au PYTHONPATH : permet "from api.main import app"
# avec la simple commande "pytest" (sans "python -m pytest").
pythonpath = .
testpaths = tests

markers =
    e2e: tests de bout en bout Selenium (nécessitent Chrome et une API démarrée)

# Par défaut, "pytest" n'exécute PAS les tests e2e (CI, poste sans Chrome, API éteinte).
# Pour les lancer explicitement : pytest -m e2e
addopts = -m "not e2e"
