# Pipeline Logstash : fichier de logs JSON de l'API  ->  Elasticsearch
input {
  file {
    path => "/usr/share/logstash/app-logs/*.log"
    start_position => "beginning"
    # sincedb persistant (volume logstash-data) : pas de ré-ingestion après un redémarrage
    sincedb_path => "/usr/share/logstash/data/sincedb_ml_churn"
    codec => "json"
  }
}

filter {
  # Le champ "timestamp" de l'API devient l'horodatage officiel de l'événement
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    add_field => { "service" => "ml-churn-api" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ml-churn-logs-%{+YYYY.MM.dd}"
  }
}
